openapi: 3.0.3
info:
  title: Student Management API
  description: Explore, understand and test the available REST API endpoints for Student Management and related operations.
  version: v1.0.0
servers:
  - url: 'https://api.example.com/v1'
    description: Production Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          example: "john@example.com"
        phone:
          type: string
          example: "+1-555-0123"
        createdAt:
          type: string
          format: date-time
          example: "2023-10-01T10:00:00Z"
    
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 101
        name:
          type: string
          example: "Cloud Computing Textbook"
        price:
          type: number
          example: 49.99
        category:
          type: string
          example: "Books"

    Order:
      type: object
      properties:
        id:
          type: integer
          example: 5001
        userId:
          type: integer
          example: 1
        total:
          type: number
          example: 49.99
        status:
          type: string
          example: "Shipped"

paths:
  /health:
    get:
      tags:
        - System
      summary: API Health Check
      description: Returns the health status of the API systems.
      responses:
        '200':
          description: All systems operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "Operational"
                  uptime:
                    type: string
                    example: "99.98%"
                  responseTime:
                    type: integer
                    example: 124

  /users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Returns a list of registered users.
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error

    post:
      tags:
        - Users
      summary: Create a new user
      description: Registers a new user in the system.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User created successfully

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieves details of a specific user.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

    put:
      tags:
        - Users
      summary: Update user
      description: Updates information for an existing user.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User updated successfully

    delete:
      tags:
        - Users
      summary: Delete user
      description: Removes a user from the system.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: User deleted successfully

  /products:
    get:
      tags:
        - Products
      summary: Get all products
      description: Returns a list of all available products.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    
    post:
      tags:
        - Products
      summary: Add a new product
      description: Adds a new product to the catalog.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Product added

  /products/{id}:
    get:
      tags:
        - Products
      summary: Get product by ID
      description: Retrieves details of a specific product.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /orders:
    get:
      tags:
        - Orders
      summary: Get all orders
      description: Retrieves a list of orders (admin only).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    
    post:
      tags:
        - Orders
      summary: Create an order
      description: Places a new order for a user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                productIds:
                  type: array
                  items:
                    type: integer
      responses:
        '201':
          description: Order created
